<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>I-Know Migration - Semesters</title>
    <style>
        nav {
            background-color: #f0f0f0;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        nav a {
            margin-right: 1.5rem;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 0.8rem;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        h1, h2 {
            margin-top: 2rem;
            color: #333;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/migrate}">Migrate Students</a>
    <a th:href="@{/semester/migrate-semesters}">Migrate Semesters</a>
    <a th:href="@{/student-subject}">Subject Enrollments</a>
</nav>

<h1>Semester Lists</h1>

<h2>MSSQL Semesters</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Semester Type ID</th>
        <th>Faculty ID</th>
        <th>Description</th>
        <th>CH Start Date</th>
        <th>CH End Date</th>
    </tr>
    <tr th:each="semester : ${mssemesters}">
        <td th:text="${semester.id}"></td>
        <td th:text="${semester.startDate}"></td>
        <td th:text="${semester.endDate}"></td>
        <td th:text="${semester.semesterTypeId}"></td>
        <td th:text="${semester.facultyId}"></td>
        <td th:text="${semester.description}"></td>
        <td th:text="${semester.chStartDate}"></td>
        <td th:text="${semester.chEndDate}"></td>
    </tr>
</table>

<h2>PostgreSQL Semesters</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Semester Type ID</th>
        <th>Faculty ID</th>
        <th>Description</th>
        <th>CH Start Date</th>
        <th>CH End Date</th>
    </tr>
    <tr th:each="semester : ${psemesters}">
        <td th:text="${semester.id}"></td>
        <td th:text="${semester.startDate}"></td>
        <td th:text="${semester.endDate}"></td>
        <td th:text="${semester.semesterTypeId}"></td>
        <td th:text="${semester.facultyId}"></td>
        <td th:text="${semester.description}"></td>
        <td th:text="${semester.chStartDate}"></td>
        <td th:text="${semester.chEndDate}"></td>
    </tr>
</table>

</body>
</html>
