services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_POSTGRES_JDBC-URL: ${SPRING_DATASOURCE_POSTGRES_JDBC_URL}
      SPRING_DATASOURCE_POSTGRES_USERNAME: ${SPRING_DATASOURCE_POSTGRES_USERNAME}
      SPRING_DATASOURCE_POSTGRES_PASSWORD: ${SPRING_DATASOURCE_POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}

      SPRING_DATASOURCE_SQLSERVER_JDBC-URL: ${SPRING_DATASOURCE_SQLSERVER_JDBC_URL}
      SPRING_DATASOURCE_SQLSERVER_USERNAME: ${SPRING_DATASOURCE_SQLSERVER_USERNAME}
      SPRING_DATASOURCE_SQLSERVER_PASSWORD: ${SPRING_DATASOURCE_SQLSERVER_PASSWORD}

    ports:
      - "8080:8080"
    networks:
      - dm_network

  postgres:
    image: postgres:15
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dm_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 10
      start_period: 40s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - dm_network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pg_data:
  mssql_data:

networks:
  dm_network:
    driver: bridge
